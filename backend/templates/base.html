<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Asymmetry{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #faf8f5;
      --surface:   #ffffff;
      --border:    #e8e2d9;
      --text:      #1a1815;
      --muted:     #7a7268;
      --accent:    #c85a1a;
      --accent-lt: #fff0e8;
      --green:     #2d7a3a;
      --green-lt:  #edf7ef;
      --font:      -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono:      "JetBrains Mono", "Fira Mono", monospace;
      --radius:    10px;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; color: var(--accent); text-decoration: none; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    nav a:hover, nav a.active { color: var(--text); }

    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.1rem; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; text-decoration: none;
      border: none; font-family: var(--font); transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-green { background: var(--green); color: #fff; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    .tag {
      display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; background: var(--accent-lt); color: var(--accent);
    }
    .tag-green { background: var(--green-lt); color: var(--green); }

    .stat-box {
      text-align: center; padding: 1.25rem;
    }
    .stat-box .number { font-family: var(--mono); font-size: 2.2rem; font-weight: 700; color: var(--accent); }
    .stat-box .label { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: .05em; }

    input[type=text], input[type=url], input[type=datetime-local], select, textarea {
      width: 100%; padding: 0.55rem 0.85rem; border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 0.9rem;
      background: var(--bg); color: var(--text); outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    label { font-size: 0.82rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.3rem; }

    .form-row { margin-bottom: 1rem; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="/">Asymmetry</a>
    <a href="/" {% if active_page == 'library' %}class="active"{% endif %}>Library</a>
    <a href="/shopping" {% if active_page == 'shopping' %}class="active"{% endif %}>Shopping</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
